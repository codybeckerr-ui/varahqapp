<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VaraHQ Workspace</title><style>
:root{--g:#0F2D24;--s:#7A9B87;--bg:#f5f7f5;--line:#dce5e0;--mut:#687871}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--g)}button,input,select{font:inherit}.hidden{display:none!important}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:var(--g);color:white;padding:26px 18px;display:flex;flex-direction:column}.brand{font-weight:900;letter-spacing:.1em;font-size:20px;padding:4px 10px 32px}.brand span{color:var(--s)}.nav button{width:100%;text-align:left;background:none;border:0;color:#dce7e2;padding:12px;border-radius:8px;cursor:pointer;margin:2px 0}.nav button:hover,.nav button.active{background:#ffffff14;color:white}.side small{margin-top:auto;color:#9fb1a8;padding:10px}.main{padding:38px;max-width:1250px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.eyebrow{font-size:11px;letter-spacing:.17em;font-weight:900;color:var(--s)}h1{font-size:38px;margin:8px 0}.muted{color:var(--mut)}.btn{border:0;border-radius:8px;padding:12px 17px;background:var(--g);color:white;font-weight:800;cursor:pointer}.outline{background:white;color:var(--g);border:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:22px}.metric{font-size:31px;font-weight:900;margin-top:7px}.templates{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}.template{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden}.preview{height:180px;background:linear-gradient(135deg,#e8ece9 0 55%,var(--s) 55%);display:grid;place-items:center;color:#fff;font-weight:900}.template .body{padding:17px}.pill{font-size:11px;background:#e8efeb;padding:5px 8px;border-radius:99px}.empty{padding:55px;text-align:center;background:white;border:1px dashed #bdcbc4;border-radius:14px;margin-top:28px}.builder{display:grid;grid-template-columns:1fr 310px;gap:20px;margin-top:25px}.canvas{min-height:520px;background:#dfe5e2;border-radius:14px;display:grid;place-items:center;padding:30px}.page{background:white;width:min(100%,640px);aspect-ratio:1.75;box-shadow:0 15px 35px #0f2d2420;position:relative}.field{position:absolute;left:10%;top:18%;width:52%;border:2px solid var(--s);padding:10px;color:#fff;background:#0F2D24}.inspector{background:white;border:1px solid var(--line);border-radius:14px;padding:20px}.inspector label{display:block;font-size:11px;font-weight:800;margin:15px 0 6px}.inspector input,.inspector select{width:100%;padding:10px;border:1px solid #cbd7d1;border-radius:7px}.notice{background:#eef3f0;border:1px solid #d6e1db;padding:13px;border-radius:9px;font-size:12px;line-height:1.5;margin-top:18px}.auth{min-height:100vh;display:grid;place-items:center}.authbox{background:white;border:1px solid var(--line);border-radius:16px;padding:30px;max-width:420px}@media(max-width:850px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:22px}.grid,.templates{grid-template-columns:1fr}.builder{grid-template-columns:1fr}.inspector{order:-1}}
</style></head><body><div id="loading" class="auth"><div class="authbox"><div class="eyebrow">VARAHQ</div><h2>Opening your workspace…</h2><p class="muted">Checking your secure session.</p></div></div><div id="shell" class="shell hidden"><aside class="side"><div class="brand">VARA<span>HQ</span></div><div class="nav"><button data-view="home" class="active">Home</button><button data-view="templates">Templates</button><button data-view="builder">Template Builder</button><button data-view="team">Team</button><button data-view="brandkit">Brand Kit</button><button data-view="downloads">Downloads</button></div><small>Test Company</small></aside><main class="main"><div class="top"><div><div class="eyebrow">TEST COMPANY</div><h1 id="title">Dashboard</h1></div><button id="logout" class="btn outline">Sign Out</button></div><div id="content"></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://wzgfzopxltgfkejpofat.supabase.co','sb_publishable_R4UOrzo-lb95ExANWotdPw_2VSADYzc');const loading=document.getElementById('loading'),shell=document.getElementById('shell'),content=document.getElementById('content'),title=document.getElementById('title');
const views={home:()=>`<p class="muted">Manage your organization's approved brand assets.</p><div class="grid"><div class="card"><div class="muted">Published Templates</div><div class="metric">0</div></div><div class="card"><div class="muted">Team Members</div><div class="metric">1</div></div><div class="card"><div class="muted">Generated Assets</div><div class="metric">0</div></div></div><div class="card" style="margin-top:18px"><h3>Start with your first template</h3><p class="muted">Upload a Canva-exported PDF, define the variable fields once, test it, then publish it for your team.</p><button class="btn" onclick="show('builder')">Create Template</button></div>`,templates:()=>`<div class="top"><p class="muted">Approved and draft templates for Test Company.</p><button class="btn" onclick="show('builder')">+ New Template</button></div><div class="empty"><h3>No templates yet</h3><p class="muted">Your first compiled Vara Template will appear here.</p></div>`,builder:()=>`<p class="muted">Design → Fields → Permissions → Test → Publish</p><div class="builder"><div class="canvas"><div class="page"><div class="field">{{FULL_NAME}}</div></div></div><div class="inspector"><div class="eyebrow">SELECTED FIELD</div><h3>Full Name</h3><label>Variable</label><input value="FULL_NAME"><label>Data Source</label><select><option>User · Full Name</option></select><label>Font</label><input value="Detected from PDF" disabled><label>Font Size</label><input value="16 pt"><label>Minimum Size</label><input value="12 pt"><label>Alignment</label><select><option>Left</option><option>Center</option><option>Right</option></select><label>Overflow</label><select><option>Shrink to fit</option><option>Wrap</option><option>Reject</option></select><div class="notice"><b>Brand rule:</b> these controls belong to the admin compiler. End users never see or override typography, position, color, alignment or overflow rules.</div><button class="btn" style="width:100%;margin-top:18px">Test Template</button></div></div>`,team:()=>`<div class="card"><h3>Team</h3><p class="muted">Organization members and roles will appear here. Roles: owner, admin, manager and member.</p></div>`,brandkit:()=>`<div class="card"><h3>Brand Kit</h3><p class="muted">Approved logos, fonts, colors and disclaimers for Test Company.</p></div>`,downloads:()=>`<div class="empty"><h3>No generated assets yet</h3><p class="muted">Generated PDF, PNG and JPG assets will be recorded here.</p></div>`};
function show(v){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));title.textContent={home:'Dashboard',templates:'Templates',builder:'Template Builder',team:'Team',brandkit:'Brand Kit',downloads:'Downloads'}[v];content.innerHTML=views[v]()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.view));document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.href='./index.html'};
(async()=>{const {data}=await sb.auth.getSession();if(!data.session){location.href='./index.html#signin';return}loading.classList.add('hidden');shell.classList.remove('hidden');show('home')})();
</script></body></html>
