<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VaraHQ Workspace</title>
  <link rel="icon" type="image/png" href="./assets/vara-logo-full.png">
  <link rel="stylesheet" href="./assets/template-workflow.css">
  <style>
    :root{--g:#0F2D24;--s:#7A9B87;--c:#1F1F1F;--st:#E8E7E1;--w:#FFFFFF;--bg:#E8E7E1;--line:#c8d3cc;--mut:#687871;--danger:#9c2f2f;--success:#286344}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--g)}button,input,select{font:inherit}.hidden{display:none!important}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:var(--g);color:var(--w);padding:24px 18px;display:flex;flex-direction:column}.brand{display:grid;place-items:center;min-height:94px;background:var(--w);border-radius:10px;overflow:hidden;margin:0 4px 8px;padding:12px}.brand-logo{display:block;max-width:100%;max-height:76px;width:auto;height:auto;object-fit:contain}.brand-fallback{font-size:20px;font-weight:900;text-align:center;color:var(--g)}.powered-by{display:flex;align-items:center;justify-content:center;gap:7px;color:#b7c8bf;font-size:10px;margin:0 4px 24px}.powered-by img{width:74px;height:auto;filter:brightness(0) invert(1);opacity:.72}.mobile-brand{display:none}.nav button{width:100%;text-align:left;background:none;border:0;color:#dce7e2;padding:12px;border-radius:8px;cursor:pointer;margin:2px 0}.nav button:hover,.nav button.active{background:#ffffff14;color:var(--w)}.organization{margin-top:auto;color:#dce7e2;padding:10px;display:grid;gap:3px}.organization small{color:#9fb1a8}.top-actions{display:flex;align-items:center;gap:10px}.role-preview-toggle{white-space:nowrap}.preview-notice{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff7db;border:1px solid #d9b95d;border-radius:9px;padding:10px 13px;margin:18px 0 0;font-size:12px;color:var(--c)}.preview-notice button{border:0;background:none;color:var(--g);font-weight:900;cursor:pointer}.main{padding:38px;max-width:1250px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.eyebrow{font-size:11px;letter-spacing:.17em;font-weight:900;color:var(--s)}h1{font-size:38px;margin:8px 0}.muted{color:var(--mut)}.btn{border:0;border-radius:8px;padding:12px 17px;background:var(--g);color:var(--w);font-weight:800;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.outline{background:var(--w);color:var(--g);border:1px solid var(--s)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px}.card{background:var(--w);border:1px solid var(--line);border-radius:14px;padding:22px}.metric{font-size:31px;font-weight:900;margin-top:7px}.upload-panel{display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:start;margin-top:25px}.upload-form label{display:block;font-size:12px;font-weight:800;margin:16px 0 7px}.upload-form input[type=text],.upload-form textarea{width:100%;padding:12px;border:1px solid var(--s);border-radius:8px;color:var(--c);background:var(--w)}.upload-form textarea{min-height:84px;resize:vertical}.file-drop{display:block;border:2px dashed var(--s);border-radius:12px;padding:28px;text-align:center;background:#f8faf8;cursor:pointer}.file-drop:hover{background:var(--st)}.file-drop input{display:block;margin:13px auto 0;max-width:100%}.steps{margin:0;padding-left:20px;color:var(--mut);line-height:1.7}.form-message{min-height:22px;margin:12px 0 0;font-size:13px}.success{color:var(--success)}.templates{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}.template{background:var(--w);border:1px solid var(--line);border-radius:14px;overflow:hidden}.preview{height:180px;background:linear-gradient(135deg,var(--st) 0 55%,var(--s) 55%);display:grid;place-items:center;color:var(--w);font-weight:900}.template .body{padding:17px}.template-meta{display:flex;justify-content:space-between;align-items:center;gap:8px}.pill{font-size:11px;background:var(--st);padding:5px 8px;border-radius:99px;text-transform:capitalize}.empty{padding:55px;text-align:center;background:var(--w);border:1px dashed var(--s);border-radius:14px;margin-top:28px}.builder{display:grid;grid-template-columns:1fr 310px;gap:20px;margin-top:25px}.canvas{min-height:520px;background:var(--st);border-radius:14px;display:grid;place-items:center;padding:30px}.page{background:var(--w);width:min(100%,640px);aspect-ratio:1.75;box-shadow:0 15px 35px #0f2d2420;position:relative}.field{position:absolute;left:10%;top:18%;width:52%;border:2px solid var(--s);padding:10px;color:var(--w);background:var(--g)}.inspector{background:var(--w);border:1px solid var(--line);border-radius:14px;padding:20px}.inspector label{display:block;font-size:11px;font-weight:800;margin:15px 0 6px}.inspector input,.inspector select{width:100%;padding:10px;border:1px solid var(--s);border-radius:7px;color:var(--c);background:var(--w)}.notice{background:var(--st);border:1px solid var(--s);padding:13px;border-radius:9px;font-size:12px;line-height:1.5;margin-top:18px}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox{background:var(--w);border:1px solid var(--s);border-radius:16px;padding:30px;max-width:460px}.auth-logo{display:block;width:min(100%,210px);height:auto;margin-bottom:18px}.error{color:var(--danger)}@media(max-width:850px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:22px}.mobile-brand{display:block;width:150px;height:auto;margin:0 0 20px}.grid,.templates,.upload-panel{grid-template-columns:1fr}.builder{grid-template-columns:1fr}.inspector{order:-1}.top{align-items:flex-start}.top-actions{align-items:stretch;flex-direction:column}.top-actions .btn{padding:9px 12px}.preview-notice{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <div id="loading" class="auth"><div class="authbox"><img class="auth-logo" src="./assets/vara-logo-full.png" alt="VARAHQ — Brand Assets. Simplified."><h2>Opening your workspace…</h2><p id="loadingMessage" class="muted">Checking your secure session and organization access.</p></div></div>
  <div id="shell" class="shell hidden">
    <aside class="side">
      <div class="brand"><img id="organizationLogo" class="brand-logo hidden" alt=""><div id="organizationLogoFallback" class="brand-fallback"></div></div>
      <div class="powered-by"><span>Powered by</span><img src="./assets/vara-logo-full.png" alt="VaraHQ"></div>
      <div class="nav"><button data-view="home" class="active">Home</button><button data-view="templates">Templates</button><button data-view="builder">Template Builder</button><button data-view="team">Team</button><button data-view="brandkit">Brand Library</button><button data-view="mylibrary">My Library</button><button data-view="downloads">Downloads</button></div>
      <div class="organization"><strong id="sidebarOrganization"></strong><small id="sidebarRole"></small></div>
    </aside>
    <main class="main"><div class="mobile-brand"><img id="mobileOrganizationLogo" class="brand-logo hidden" alt=""><div id="mobileOrganizationFallback" class="brand-fallback"></div></div><div class="top"><div><div class="eyebrow" id="organizationEyebrow"></div><h1 id="title">Dashboard</h1></div><div class="top-actions"><button id="rolePreviewToggle" class="btn outline role-preview-toggle hidden" type="button" aria-pressed="false">Preview as User</button><button id="logout" class="btn outline">Sign Out</button></div></div><div id="previewNotice" class="preview-notice hidden"><span><b>User Preview</b> — You are seeing the workspace as a regular user.</span><button id="exitUserPreview" type="button">Return to Admin View</button></div><div id="content"></div></main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const sb = supabase.createClient('https://wzgfzopxltgfkejpofat.supabase.co', 'sb_publishable_R4UOrzo-lb95ExANWotdPw_2VSADYzc');
    const loading = document.getElementById('loading');
    const loadingMessage = document.getElementById('loadingMessage');
    const shell = document.getElementById('shell');
    const content = document.getElementById('content');
    const title = document.getElementById('title');
    const state = { profile: null, membership: null, organization: null, templates: [], allTemplates: [], brandAssets: [], allBrandAssets: [], personalItems: [], actualIsAdmin: false, isAdmin: false, previewAsUser: false, currentView: 'home', homeQuery: '', homeCategory: 'All', counts: { templates: 0, members: 0, assets: 0 }, organizationAssetCount: 0, userAssetCount: 0 };
    const libraryCategoryOptions = ['General', 'Guides', 'Signage', 'Social', 'Print & Mail', 'Stationery', 'Logos', 'Icons', 'Embroidery', 'Fonts'];

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));
    }

    function categoryDatalist(id) {
      return `<datalist id="${id}">${libraryCategoryOptions.map(category => `<option value="${escapeHtml(category)}">`).join('')}</datalist>`;
    }

    function adminDashboardView() {
      return `<p class="muted">Welcome${state.profile?.full_name ? `, ${escapeHtml(state.profile.full_name)}` : ''}. Manage your organization's approved brand assets.</p><div class="grid"><div class="card"><div class="muted">Published Templates</div><div class="metric">${state.counts.templates}</div></div><div class="card"><div class="muted">Team Members</div><div class="metric">${state.counts.members}</div></div><div class="card"><div class="muted">Generated Assets</div><div class="metric">${state.counts.assets}</div></div></div><div class="card" style="margin-top:18px"><h3>${state.templates.length ? 'Manage your template library' : 'Start with your first template'}</h3><p class="muted">Upload a Canva-exported PDF as a locked master, then configure and approve its variable fields.</p><button class="btn" onclick="show('templates')">Upload a Template</button></div>`;
    }

    function categoryButtons(categories, active, attribute) {
      return `<div class="category-chips" aria-label="Filter by category"><button type="button" class="category-chip ${active==='All'?'active':''}" ${attribute}="All">All assets</button>${categories.map(category => `<button type="button" class="category-chip ${active===category?'active':''}" ${attribute}="${escapeHtml(category)}">${escapeHtml(category)}</button>`).join('')}</div>`;
    }

    function readyTemplateCard(template) {
      return `<article class="ready-card"><div class="ready-art"><span>${escapeHtml(template.library_category || 'General')}</span><strong>${escapeHtml(template.name)}</strong><small>Approved by ${escapeHtml(state.organization.name)}</small></div><div class="ready-body"><div><strong>${escapeHtml(template.name)}</strong><p>${escapeHtml(template.library_category || 'General')} · PDF</p></div><div class="ready-actions"><button class="btn" data-personalize-template="${template.id}">Personalize</button>${libraryToggleButton('template',template.id)}</div></div></article>`;
    }

    function userDashboardView() {
      const name = state.profile?.full_name?.trim().split(/\s+/)[0] || 'there';
      const categories = [...new Set(state.templates.map(template => template.library_category || 'General'))].sort();
      const query = state.homeQuery.toLowerCase();
      const filtered = state.templates.filter(template => (state.homeCategory === 'All' || (template.library_category || 'General') === state.homeCategory) && (!query || `${template.name} ${template.description || ''} ${template.library_category || ''}`.toLowerCase().includes(query)));
      return `<section class="user-welcome"><div class="eyebrow">YOUR WORKSPACE</div><h2>Welcome back, ${escapeHtml(name)}</h2><p>Every template here is approved and ready for your details.</p><div class="workspace-callout"><div><small>READY WHEN YOU ARE</small><strong>Choose a template, personalize the approved fields, and download.</strong></div><button class="btn" onclick="show('templates')">Open Library</button></div></section><div class="user-metrics"><div class="card"><div class="metric">${state.counts.templates}</div><span>Templates ready for you</span></div><div class="card"><div class="metric">${state.personalItems.length}</div><span>Items saved to My Library</span></div><div class="card"><div class="metric">${state.userAssetCount}</div><span>Your generated files</span></div></div><section class="ready-section"><div class="ready-heading"><div><h2>Ready for you</h2><p class="muted">Find an approved design and make it yours.</p></div><label class="asset-search"><span aria-hidden="true">⌕</span><input type="search" data-home-search value="${escapeHtml(state.homeQuery)}" placeholder="Search templates"></label></div>${categoryButtons(categories,state.homeCategory,'data-home-category')}${filtered.length?`<div class="ready-grid">${filtered.map(readyTemplateCard).join('')}</div>`:`<div class="empty"><h3>No matching templates</h3><p class="muted">Try another search or category.</p></div>`}</section>`;
    }

    const views = {
      home: () => state.isAdmin ? adminDashboardView() : userDashboardView(),
      templates: () => `${state.isAdmin ? uploadPanel() : '<div class="notice">Your administrators control the designs and fields. You can personalize and download the approved templates below.</div>'}${templateLibrary()}`,
      builder: () => '<div class="card">Choose a template from Templates to configure its fields.</div>',
      team: () => `<div class="card"><h3>Team</h3><p class="muted">${state.counts.members} organization member${state.counts.members === 1 ? '' : 's'}. Your access level is <b>${state.isAdmin ? 'Admin' : 'User'}</b>.</p><div class="notice"><b>Admins</b> add, configure, test, approve, and publish templates. <b>Users</b> personalize and download published templates.</div></div>`,
      brandkit: () => `<div class="card"><p>Loading the organization library…</p></div>`,
      mylibrary: () => `<div class="card"><p>Loading your library…</p></div>`,
      downloads: () => `<div class="empty"><h3>No generated assets yet</h3><p class="muted">Generated PDF, PNG and JPG assets will be recorded here.</p></div>`
    };

    function uploadPanel() {
      return `<section class="card upload-panel"><div><div class="eyebrow">NEW TEMPLATE</div><h2>Upload a locked master PDF</h2><p class="muted">The original artwork stays private and unchanged. VaraHQ will add a controlled variable layer after the template is configured.</p><ol class="steps"><li>Export the approved design from Canva as PDF.</li><li>Upload it here to create a private draft.</li><li>Configure fields, permissions, and fitting rules.</li><li>Test before publishing to your team.</li></ol></div><form id="templateUploadForm" class="upload-form"><label for="templateName">Template name</label><input id="templateName" name="templateName" type="text" maxlength="120" placeholder="Business Card" required><label for="templateCategory">Library category</label><input id="templateCategory" name="templateCategory" type="text" list="templateCategoryOptions" maxlength="80" value="General" required>${categoryDatalist('templateCategoryOptions')}<label for="templateDescription">Description <span class="muted">(optional)</span></label><textarea id="templateDescription" name="templateDescription" maxlength="500" placeholder="Who should use this template?"></textarea><label class="file-drop" for="templateFile"><b>Choose a Canva-exported PDF</b><span class="muted"><br>PDF only · maximum 25 MB</span><input id="templateFile" name="templateFile" type="file" accept="application/pdf,.pdf" required></label><button id="templateUploadButton" class="btn" type="submit" style="width:100%;margin-top:16px">Upload & Create Draft</button><div id="templateUploadMessage" class="form-message" role="status" aria-live="polite"></div></form></section>`;
    }

    function templateLibrary() {
      if (!state.templates.length) return `<div class="empty"><h3>No templates yet</h3><p class="muted">Upload the first approved master PDF to begin.</p></div>`;
      return `<div class="templates">${state.templates.map(template => `<article class="template"><div class="preview">PDF MASTER</div><div class="body"><div class="template-meta"><strong>${escapeHtml(template.name)}</strong><span class="pill">${escapeHtml(template.status)}</span></div>${template.description ? `<p class="muted">${escapeHtml(template.description)}</p>` : ''}<small class="muted">Version ${template.current_version} · ${new Date(template.updated_at).toLocaleDateString()}</small></div></article>`).join('')}</div>`;
    }

    function show(view) {
      state.currentView = view;
      document.querySelectorAll('.nav button').forEach(button => button.classList.toggle('active', button.dataset.view === view));
      title.textContent = {home:'Dashboard',templates:'Templates',builder:'Template Builder',team:'Team',brandkit:'Brand Library',mylibrary:'My Library',downloads:'Downloads'}[view];
      content.innerHTML = views[view]();
      document.getElementById('templateUploadForm')?.addEventListener('submit', uploadTemplate);
    }

    function applyRoleView() {
      state.isAdmin = state.actualIsAdmin && !state.previewAsUser;
      state.templates = state.isAdmin ? [...state.allTemplates] : state.allTemplates.filter(template => template.status === 'published');
      state.brandAssets = state.isAdmin ? [...state.allBrandAssets] : state.allBrandAssets.filter(asset => asset.approved);
      state.counts.assets = state.isAdmin ? state.organizationAssetCount : state.userAssetCount;
      document.querySelector('[data-view=builder]').hidden = !state.isAdmin;
      document.querySelector('[data-view=team]').hidden = !state.isAdmin;
      document.getElementById('sidebarRole').textContent = state.previewAsUser ? 'User preview' : (state.actualIsAdmin ? 'Admin' : 'User');
      const toggle = document.getElementById('rolePreviewToggle');
      toggle.classList.toggle('hidden', !state.actualIsAdmin);
      toggle.textContent = state.previewAsUser ? 'Return to Admin View' : 'Preview as User';
      toggle.setAttribute('aria-pressed', String(state.previewAsUser));
      document.getElementById('previewNotice').classList.toggle('hidden', !state.previewAsUser);
    }

    function toggleRolePreview() {
      if (!state.actualIsAdmin) return;
      state.previewAsUser = !state.previewAsUser;
      applyRoleView();
      const restricted = ['builder', 'team'].includes(state.currentView);
      show(restricted ? 'home' : state.currentView);
    }

    async function loadTemplates() {
      const { data, error } = await sb.from('templates').select('id,name,description,status,current_version,revision,master_file_path,library_category,created_at,updated_at').eq('organization_id', state.organization.id).order('updated_at', {ascending:false});
      if (error) throw error;
      state.allTemplates = data || [];
      state.templates = state.isAdmin ? [...state.allTemplates] : state.allTemplates.filter(template => template.status === 'published');
      state.counts.templates = state.allTemplates.filter(template => template.status === 'published').length;
    }

    async function uploadTemplate(event) {
      event.preventDefault();
      if (!state.isAdmin) return;
      const form = event.currentTarget;
      const button = document.getElementById('templateUploadButton');
      const message = document.getElementById('templateUploadMessage');
      const file = form.templateFile.files[0];
      const name = form.templateName.value.trim();
      const description = form.templateDescription.value.trim();
      const libraryCategory = form.templateCategory.value.trim();
      if (!file || !name) return;
      if (!file.name.toLowerCase().endsWith('.pdf') || (file.type && file.type !== 'application/pdf')) {
        message.className = 'form-message error'; message.textContent = 'Please choose a PDF file.'; return;
      }
      if (file.size > 25 * 1024 * 1024) {
        message.className = 'form-message error'; message.textContent = 'That PDF is larger than 25 MB.'; return;
      }
      button.disabled = true;
      message.className = 'form-message muted';
      message.textContent = 'Uploading the private master PDF…';
      const templateId = crypto.randomUUID();
      const masterPath = `${state.organization.id}/${templateId}/master.pdf`;
      try {
        const { error: uploadError } = await sb.storage.from('template-masters').upload(masterPath, file, {contentType:'application/pdf', cacheControl:'3600', upsert:false});
        if (uploadError) throw uploadError;
        const { error: insertError } = await sb.from('templates').insert({id:templateId, organization_id:state.organization.id, name, description:description || null, library_category:libraryCategory, status:'draft', master_file_path:masterPath, created_by:state.userId});
        if (insertError) {
          await sb.storage.from('template-masters').remove([masterPath]);
          throw insertError;
        }
        await loadTemplates();
        show('templates');
        const success = document.getElementById('templateUploadMessage');
        if (success) { success.className = 'form-message success'; success.textContent = `Draft “${name}” was created securely.`; }
      } catch (error) {
        message.className = 'form-message error';
        message.textContent = error.message || 'The template could not be uploaded. Please try again.';
        button.disabled = false;
      }
    }

    document.querySelectorAll('.nav button').forEach(button => button.addEventListener('click', () => show(button.dataset.view)));
    let homeSearchTimer;
    content.addEventListener('input', event => {
      if (!event.target.matches('[data-home-search]')) return;
      const value = event.target.value;
      clearTimeout(homeSearchTimer);
      homeSearchTimer = setTimeout(() => {
        state.homeQuery = value;
        show('home');
        const search = document.querySelector('[data-home-search]');
        search?.focus();
        search?.setSelectionRange(value.length, value.length);
      }, 180);
    });
    content.addEventListener('click', event => {
      const category = event.target.closest('[data-home-category]');
      if (!category) return;
      state.homeCategory = category.dataset.homeCategory;
      show('home');
    });
    document.getElementById('rolePreviewToggle').addEventListener('click', toggleRolePreview);
    document.getElementById('exitUserPreview').addEventListener('click', toggleRolePreview);
    document.getElementById('logout').addEventListener('click', async () => { await sb.auth.signOut(); location.href = './index.html'; });

    async function loadWorkspace() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { location.href = './index.html#signin'; return; }

      const [profileResult, membershipResult] = await Promise.all([
        sb.from('profiles').select('full_name,email,title').eq('id', session.user.id).maybeSingle(),
        sb.from('organization_members').select('organization_id,role,organizations(id,name,website,industry,team_size)').eq('user_id', session.user.id).limit(1).maybeSingle()
      ]);

      if (profileResult.error || membershipResult.error) throw profileResult.error || membershipResult.error;
      if (!membershipResult.data) throw new Error('Your account is not connected to an organization yet. Please contact VaraHQ support.');

      state.profile = profileResult.data;
      state.membership = membershipResult.data;
      state.userId = session.user.id;
      state.actualIsAdmin = ['owner', 'admin'].includes(state.membership.role);
      state.isAdmin = state.actualIsAdmin;
      state.organization = Array.isArray(membershipResult.data.organizations) ? membershipResult.data.organizations[0] : membershipResult.data.organizations;
      if (!state.organization) throw new Error('Your organization could not be loaded.');

      const organizationId = state.organization.id;
      const [membersResult, assetsResult, userAssetsResult] = await Promise.all([
        sb.from('organization_members').select('*', {count:'exact',head:true}).eq('organization_id', organizationId),
        sb.from('generated_assets').select('*', {count:'exact',head:true}).eq('organization_id', organizationId),
        sb.from('generated_assets').select('*', {count:'exact',head:true}).eq('organization_id', organizationId).eq('user_id', state.userId)
      ]);

      const countError = membersResult.error || assetsResult.error || userAssetsResult.error;
      if (countError) throw countError;
      state.organizationAssetCount = assetsResult.count || 0;
      state.userAssetCount = userAssetsResult.count || 0;
      state.counts = {templates: 0, members: membersResult.count || 0, assets: state.organizationAssetCount};
      await Promise.all([loadTemplates(), loadLibraryState()]);

      document.getElementById('sidebarOrganization').textContent = state.organization.name;
      document.getElementById('organizationLogoFallback').textContent = state.organization.name;
      document.getElementById('mobileOrganizationFallback').textContent = state.organization.name;
      applyRoleView();
      document.getElementById('organizationEyebrow').textContent = state.organization.name.toUpperCase();
      loading.classList.add('hidden');
      shell.classList.remove('hidden');
      show('home');
    }

  </script>
  <script src="./assets/template-workflow.js"></script>
  <script src="./assets/library.js"></script>
  <script>
    loadWorkspace().catch(error => {
      loadingMessage.className = 'error';
      loadingMessage.textContent = error.message || 'We could not open your workspace. Please try signing in again.';
    });
  </script>
</body>
</html>
